[package]
name = "openslide-pure-rs"
version = "0.2.0"
edition = "2021"
description = "Whole slide image reader with Rust format parsers and optional native codec/compositor helpers"
license = "LGPL-2.1-only"
homepage = "https://github.com/henriksson-lab/openslide-rs"
repository = "https://github.com/henriksson-lab/openslide-rs"
readme = "README.md"
keywords = ["openslide", "pathology", "microscopy", "wsi", "mirax"]
categories = ["multimedia::images", "science", "parsing"]
include = [
    "/build.rs",
    "/docs/*.md",
    "/examples/*.rs",
    "/fixtures/*.json",
    "/fixtures/*.toml",
    "/MATURITY_PLAN.md",
    "/src/**/*.rs",
    "/src/decode/cairo_blit.c",
    "/src/decode/jpeg_crop.c",
    "/scripts/*.py",
    "/scripts/*.sh",
    "/scripts/README.md",
    "/vendor/zune-core/**",
    "/vendor/zune-jpeg/**",
    "/README.md",
    "/Cargo.toml",
]

[dependencies]
thiserror = "2"
configparser = "3"
zune-jpeg = { path = "vendor/zune-jpeg" }
png = "0.17"
byteorder = "1"
flate2 = "1"
lru = "0.12"
tiff = "0.11"
zstd-pure-rs = "0.1.2"
dicom-toolkit-jpeg2000 = { version = "0.5", default-features = false, features = ["std", "openjph-htj2k"] }
openjp2 = { package = "openjpeg2-pure-rs", git = "https://github.com/henriksson-lab/openjpeg2-pure-rs" }
jpegli = { package = "pure_jpegli", version = "1.0" }
jpegls = { package = "pure_jpegls", version = "1.0" }
jpegxr_pure_rs = { package = "jpegxr-pure-rs", version = "0.1.0", optional = true }

[features]
default = []
jpegxr = ["dep:jpegxr_pure_rs"]
jpegxr-backend = ["jpegxr"]
native-jpeg = []
native-cairo-oracle = []
